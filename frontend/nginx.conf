server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://devops-backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
